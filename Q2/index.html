<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4a - Question 2: Smart Number Validator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Question 2 — Smart Number Validator</h1>
    <div class="input-group">
      <label for="userInput">Enter a number:</label>
      <div class="controls">
        <input type="text" id="userInput" placeholder="Enter a number">
        <button id="checkBtn" type="button">Check</button>
      </div>
    </div>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
